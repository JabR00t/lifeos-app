<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeOS – Lecture &amp; Loisirs</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/reading.css">
<script src="../assets/js/storage.js"></script>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/theme.js"></script>
</head>
<body data-page="reading">
<div class="app">
<aside>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>LifeOS</div>
  <nav id="nav"></nav>
  <div class="foot"><span class="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Paramètres</span><button type="button" id="theme" aria-label="Changer de thème"></button></div>
</aside>
<main>
  <div class="head"><div><h1>Lecture &amp; Loisirs</h1><p class="sub">Consacre du temps à tes loisirs et à la découverte.</p></div></div>
  <div class="stats">
    <div class="card stat"><div class="ic g1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></div><div><small>En cours</small><b id="sC">0</b><em>Livres</em></div></div>
    <div class="card stat"><div class="ic g2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg></div><div><small>Terminés</small><b id="sF">0</b><em>Cette année</em></div></div>
    <div class="card stat"><div class="ic g3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></div><div><small>Pages</small><b id="sP">0/20</b><em>Aujourd’hui</em></div></div>
  </div>
  <div class="grid">
    <div class="col">
      <div class="card">
        <h2>Ma bibliothèque <button type="button" id="addB">+ Ajouter</button></h2>
        <div class="chips" id="bkF"><button type="button" class="chip on" data-f="all">Tous</button><button type="button" class="chip" data-f="doing">En cours</button><button type="button" class="chip" data-f="todo">À lire</button><button type="button" class="chip" data-f="done">Terminés</button></div>
        <div id="bkL"></div>
      </div>
    </div>
    <div class="col">
      <div class="card">
        <h2>Objectifs de lecture</h2>
        <div class="og"><div class="ring" id="yRing"><span id="yTxt">0/12</span></div><div><b id="yLbl"></b><div class="gs">Objectif <button type="button" class="mini" id="ygM" aria-label="Moins un livre">−</button><output id="ygV">12</output><button type="button" class="mini" id="ygP" aria-label="Plus un livre">+</button> livres</div></div></div>
        <div class="og2"><b>Pages aujourd’hui</b> <span class="meta" id="pgTxt"></span><div class="bar"><i id="pgBar"></i></div><div class="gs">Objectif quotidien <button type="button" class="mini" id="pgM" aria-label="Moins cinq pages">−</button><output id="pgV">20</output><button type="button" class="mini" id="pgP" aria-label="Plus cinq pages">+</button> pages</div></div>
      </div>
      <div class="card">
        <h2>Journal et citations</h2>
        <div class="chips" id="nK"><button type="button" class="chip on" data-k="j">Journal</button><button type="button" class="chip" data-k="c">Citations</button></div>
        <form class="jf" id="nf"><input id="nI" maxlength="200" required autocomplete="off" aria-label="Texte de la note"><input id="nS" maxlength="60" autocomplete="off" placeholder="Livre ou auteur (facultatif)" aria-label="Livre ou auteur"><button class="btn" type="submit">Ajouter</button></form>
        <div id="nL"></div>
      </div>
    </div>
  </div>
</main>
</div>
<dialog id="dlgB" aria-labelledby="bTt"><form id="bf">
  <h2 id="bTt">Nouveau livre</h2>
  <label>Titre<input id="fT" required maxlength="80" autocomplete="off"></label>
  <label>Auteur<input id="fA" maxlength="60" autocomplete="off"></label>
  <label>Nombre de pages<input id="fN" type="number" min="0" max="9999"></label>
  <label>Page actuelle<input id="fC" type="number" min="0" max="9999" value="0"></label>
  <label>Statut<select id="fS"><option value="todo">À lire</option><option value="doing">En cours</option><option value="done">Terminé</option></select></label>
  <div class="acts"><button type="button" class="ghost danger" id="fDel" hidden>Supprimer</button><span class="sp"></span><button type="button" class="ghost" data-close>Annuler</button><button class="btn" type="submit">Enregistrer</button></div>
</form></dialog>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/reading.js"></script>
</body>
</html>
